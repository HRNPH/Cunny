<!doctype html>
<html><head><meta charset="UTF-8"><title>sim calibration probe</title>
<style>body{background:#0b0d10;color:#e6e8eb;font:13px ui-monospace,monospace;padding:20px;white-space:pre-wrap}</style>
</head><body>
<div id="out">running…</div>
<script type="module">
  import { embed, cosine } from '@cunny-ai/embed'
  import { similarity } from '@cunny-ai/similarity'
  const pairs = [
    ['the cat sat on the mat', 'a feline rested on a rug'],
    ['the cat sat on the mat', 'quantum computers use qubits'],
    ['A man is playing a guitar.', 'Someone plays an instrument.'],
    ['The weather is cold today.', 'It is freezing outside today.'],
  ]
  const out = document.getElementById('out')
  try {
    const texts = pairs.flat()
    const vecs = await embed(texts)
    let s = ''
    for (let i = 0; i < pairs.length; i++) {
      const raw = cosine(vecs[i * 2], vecs[i * 2 + 1])
      const cal = await similarity(pairs[i][0], pairs[i][1])
      s += raw.toFixed(3) + ' ' + cal.toFixed(3) + ' | ' + pairs[i][0].slice(0,18) + '\n'
    }
    out.textContent = s
  } catch (e) {
    out.textContent = 'FAIL ' + e.message
  }
</script>
</body></html>
